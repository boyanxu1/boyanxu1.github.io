name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install compatible dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch and validate citation data
        run: timeout --kill-after=10s 150s python -u google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Checkout citation history
        uses: actions/checkout@v6
        with:
          ref: google-scholar-stats
          path: citation-data
      - name: Publish citation data
        working-directory: citation-data
        run: |
          cp ../google_scholar_crawler/results/gs_data*.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.'
          else
            git commit -m 'Update Google Scholar citation data'
            git push origin HEAD:google-scholar-stats
          fi
      - name: Report citation refresh
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('google_scholar_crawler/results/gs_data.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Updated {data['name']}: **{data['citedby']} citations**.\n\n")
              summary.write(f"Fetched at {data['updated']}; {len(data['publications'])} publications.\n")
          PY
