name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '_includes/fetch_google_scholar_stats.html'
      - '.github/workflows/google_scholar_crawler.yaml'
  pull_request:
    paths:
      - 'google_scholar_crawler/**'
      - '_includes/fetch_google_scholar_stats.html'
      - '.github/workflows/google_scholar_crawler.yaml'

permissions:
  contents: read

concurrency:
  group: google-scholar-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test citation updater (offline)
        run: python -m unittest discover -s google_scholar_crawler/tests -v
      - name: Test citation display (offline)
        run: node --test google_scholar_crawler/tests/test_display.cjs

  update:
    # PR checks cannot fetch live data or publish to the website's data branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Checkout citation history
        uses: actions/checkout@v6
        with:
          ref: google-scholar-stats
          path: citation-data
      - name: Fetch and validate citation data
        id: refresh
        continue-on-error: true
        run: timeout --kill-after=5s 60s python -u google_scholar_crawler/main.py --previous-data citation-data/gs_data.json
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Record an interrupted fetch
        if: steps.refresh.outcome == 'failure'
        run: |
          if [ ! -f google_scholar_crawler/results/gs_status.json ]; then
            python google_scholar_crawler/main.py --previous-data citation-data/gs_data.json --failed-attempt || test "$?" -eq 2
          fi
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish citation data or refresh status
        working-directory: citation-data
        run: |
          # Failed refreshes only produce gs_status.json; leave last-good bytes alone.
          cp ../google_scholar_crawler/results/gs_*.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json gs_status.json
          if git diff --cached --quiet; then
            echo 'Citation data and status are unchanged.'
          else
            git commit -m 'Update Google Scholar citation data or refresh status'
            git push origin HEAD:google-scholar-stats
          fi
      - name: Report citation refresh
        if: always() && steps.refresh.outcome != 'skipped'
        # A stale run remains failed, with its reason and last success in the summary.
        run: python google_scholar_crawler/main.py --report
