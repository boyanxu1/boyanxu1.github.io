name: Test Citation Data

on:
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '_includes/fetch_google_scholar_stats.html'
      - '.github/workflows/google_scholar_crawler.yaml'
  pull_request:
    paths:
      - 'google_scholar_crawler/**'
      - '_includes/fetch_google_scholar_stats.html'
      - '.github/workflows/google_scholar_crawler.yaml'

permissions:
  contents: read

concurrency:
  group: google-scholar-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test citation updater (offline)
        run: python -m unittest discover -s google_scholar_crawler/tests -v
      - name: Test citation display (offline)
        run: node --test google_scholar_crawler/tests/test_display.cjs
